<!doctype html>
<html lang="el" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AthensOne — Χάρτης Πολίτη</title>
  <link rel="icon" href="data:,">
  <!-- MapLibre GL JS 5.3.0 CSS from jsDelivr CDN (source: SPEC.md "Engine και στυλ", certainty: verified). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>
  <div id="map" role="region" aria-label="Χάρτης Αθήνας"></div>

  <!-- Six floating HUD containers matching SPEC.md "HUD (glassmorphism)" (certainty: verified). -->
  <div class="hud" aria-label="Χειριστήρια χάρτη">
    <div id="hud-tabs" class="hud-top-left glass glass-pill hud-tabs" role="region" aria-label="Καρτέλες και θέμα" data-active-tab="map">
      <div class="hud-tablist" role="tablist" aria-label="Προβολή">
        <button id="tab-map" type="button" class="hud-btn hud-tab is-active" role="tab" aria-selected="true" data-tab="map">Χάρτης</button>
        <button id="tab-works" type="button" class="hud-btn hud-tab" role="tab" aria-selected="false" data-tab="works">Έργα</button>
      </div>
      <span class="hud-divider" aria-hidden="true"></span>
      <!-- Visible Greek label ("Σκοτεινό"/"Φωτεινό") serves as the accessible name for WCAG 2.5.3 label-in-name (TASKS_A.md A5). -->
      <button id="theme-toggle" type="button" class="hud-btn hud-theme-btn" aria-pressed="false">Σκοτεινό</button>
    </div>
    <nav id="hud-layerbar" class="hud-top-center" aria-label="Επίπεδα χάρτη"></nav>
    <div id="hud-points" class="hud-top-right" role="region" aria-label="Πόντοι Γειτονιάς"></div>
    <div id="hud-report" class="hud-bottom-left" role="region" aria-label="Αναφορά συμβάντος"></div>
    <div id="hud-routing" class="hud-bottom-center" role="region" aria-label="Διαδρομές"></div>
    <div id="hud-stoa" class="hud-bottom-right" role="region" aria-label="Stoa AI"></div>
    <div id="hud-offline" class="glass glass-pill hidden" role="status" aria-live="polite">Offline λειτουργία</div>
    <div id="hud-toast" class="hud-toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- MapLibre GL JS 5.3.0 JS from jsDelivr CDN (source: SPEC.md "Engine και στυλ", certainty: verified). -->
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
